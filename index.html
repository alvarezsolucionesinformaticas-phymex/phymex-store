<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Tailwind CSS CDN para diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header / Banner dinámico de la Tienda -->
    <header id="store-header" class="shadow-md py-6 px-4 text-white transition-colors duration-300">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img id="store-logo" src="" alt="Logo" class="w-16 h-16 rounded-full object-cover bg-white shadow hidden border-2 border-white">
                <div>
                    <h1 id="store-name" class="text-2xl font-bold">Cargando tienda...</h1>
                    <p id="store-location" class="text-sm opacity-90"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <h2 class="text-xl font-semibold mb-6 text-gray-700 border-b pb-2">Catálogo de Productos</h2>
        
        <!-- Estado de Carga -->
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-3xl text-gray-400"></i>
            <p class="mt-2 text-gray-500">Sincronizando catálogo con la nube...</p>
        </div>

        <!-- Mensaje de Error -->
        <div id="error-container" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <strong class="font-bold">Aviso del sistema:</strong>
            <span id="error-message" class="block sm:inline">No se pudo cargar la información de la tienda. Verifique el parámetro en la URL.</span>
        </div>

        <!-- Cuadrícula de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6 hidden">
            <!-- Los productos se inyectarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-t py-4 text-center text-sm text-gray-500">
        <p>Potenciado por <span class="font-semibold text-purple-600">PhyMEx Store</span></p>
    </footer>

    <!-- Lógica de lectura de datos -->
    <script>
        async function loadStore() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeSlug = urlParams.get('store');

            if (!storeSlug) {
                showError("No se ha especificado ninguna tienda. Use el formato de enlace: ?store=nombre_tienda");
                return;
            }

            try {
                // Petición simultánea del config y el products del artesano respectivo
                const [configRes, productsRes] = await Promise.all([
                    fetch(`./artesanos/${storeSlug}/config.json`),
                    fetch(`./artesanos/${storeSlug}/products.json`)
                ]);

                if (!configRes.ok || !productsRes.ok) {
                    throw new Error("No se encontraron los registros para esta tienda en el repositorio.");
                }

                const config = await configRes.json();
                const catalog = await productsRes.json();

                renderStore(config, catalog, storeSlug);
            } catch (err) {
                showError("Error al sincronizar los datos: " + err.message);
            }
        }

        function renderStore(config, catalog, storeSlug) {
            document.getElementById('loading').classList.add('hidden');
            
            // Configurar metadatos visuales
            document.title = `${config.name} - Catálogo Oficial`;
            document.getElementById('store-name').textContent = config.name;
            document.getElementById('store-location').textContent = `${config.city}, ${config.province} • Propietario: ${config.owner}`;
            
            // Aplicar color primario corporativo de la PyME
            const primaryColor = config.primary_color || '#6750A4';
            document.getElementById('store-header').style.backgroundColor = primaryColor;

            // Gestionar Logo si existe
            const logoImg = document.getElementById('store-logo');
            if (config.logo && config.logo.trim() !== '') {
                logoImg.src = config.logo.startsWith('http') ? config.logo : `./artesanos/${storeSlug}/${config.logo}`;
                logoImg.classList.remove('hidden');
            }

            // Renderizar listado de productos
            const grid = document.getElementById('products-grid');
            grid.classList.remove('hidden');

            if (!catalog.products || catalog.products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">Este taller aún no cuenta con productos activos en la web.</p>';
                return;
            }

            grid.innerHTML = catalog.products.map(p => {
                // Estructurar el mensaje predefinido para WhatsApp
                const whatsappText = `¡Hola ${config.owner}! Me interesa el producto *${p.name}* (Precio: $${p.price}) que vi en el catálogo web de ${config.name}. ¿Hay disponibilidad?`;
                const whatsappUrl = `https://wa.me/${config.whatsapp}?text=${encodeURIComponent(whatsappText)}`;
                
                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div>
                            ${p.image ? `<img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">` : `<div class="w-full h-48 bg-gray-100 flex items-center justify-center text-gray-400"><i class="fas fa-store text-3xl"></i></div>`}
                            <div class="p-4">
                                <h3 class="font-bold text-lg text-gray-800 mb-1">${p.name}</h3>
                                <p class="text-gray-600 text-sm mb-3 line-clamp-2">${p.description || 'Sin descripción adicional'}</p>
                                <div class="text-xl font-bold text-gray-900 mb-2">$${p.price.toFixed(2)}</div>
                                <span class="inline-block text-xs px-2 py-1 rounded bg-green-50 text-green-700 font-medium">Stock disponible: ${p.stock}</span>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <a href="${whatsappUrl}" target="_blank" class="w-full block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
                                <i class="fab fa-whatsapp text-lg"></i>
                                <span>Pedir por WhatsApp</span>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errBox = document.getElementById('error-container');
            document.getElementById('error-message').textContent = msg;
            errBox.classList.remove('hidden');
        }

        window.onload = loadStore;
    </script>
</body>
</html>
