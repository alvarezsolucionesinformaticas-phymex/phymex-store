<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col pb-24">

    <!-- Header / Banner dinámico -->
    <header id="store-header" class="shadow-md py-6 px-4 text-white transition-colors duration-300">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-5">
                <img id="store-logo" src="" alt="Logo" class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl object-cover bg-white shadow-lg hidden border-2 border-white flex-shrink-0">
                <div>
                    <h1 id="store-name" class="text-2xl sm:text-3xl font-bold">Cargando tienda...</h1>
                    <p id="store-owner" class="text-sm sm:text-base opacity-90 mt-1"></p>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        <h2 class="text-xl font-semibold mb-6 text-gray-700 border-b pb-2">Catálogo de Productos</h2>
        
        <!-- Estado de Carga -->
        <div id="loading" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-3xl text-gray-400"></i>
            <p class="mt-2 text-gray-500">Sincronizando catálogo con la nube...</p>
        </div>

        <!-- Mensaje de Error -->
        <div id="error-container" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
            <strong class="font-bold">Aviso del sistema:</strong>
            <span id="error-message" class="block sm:inline">No se pudo cargar la información de la tienda.</span>
        </div>

        <!-- Cuadrícula de Productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6 hidden">
            <!-- Inyectado dinámicamente -->
        </div>
    </main>

    <!-- Barra Flotante del Carrito -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-gray-900 text-white p-4 shadow-2xl transform translate-y-full transition-transform duration-300 flex justify-between items-center max-w-2xl mx-auto sm:rounded-t-2xl z-40 border-t border-gray-800">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div>
                <span id="cart-count" class="font-bold block text-sm">0 productos</span>
                <span class="text-xs text-gray-300">Total: <span id="cart-total" class="font-bold text-emerald-400">$0.00</span></span>
            </div>
        </div>
        <button onclick="openCartModal()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2.5 rounded-xl font-bold text-sm shadow transition-colors flex items-center space-x-2">
            <span>Ver Carrito</span>
            <i class="fas fa-chevron-up text-xs"></i>
        </button>
    </div>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-3 border-b pb-3">
                <h3 class="text-xl font-bold text-gray-800 flex items-center">
                    <i class="fas fa-shopping-bag mr-2 text-purple-600"></i> Tu Pedido
                </h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold">&times;</button>
            </div>
            
            <div id="cart-items-list" class="overflow-y-auto flex-grow divide-y divide-gray-100 mb-3 pr-1 max-h-48">
                <!-- Items del carrito -->
            </div>

            <!-- Datos de Contacto Obligatorios (Tabla orders) -->
            <div class="border-t pt-3 mb-4 space-y-3 bg-gray-50 p-3 rounded-xl">
                <h4 class="font-semibold text-gray-700 text-sm">Datos de Contacto</h4>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Nombre y Apellido *</label>
                    <input type="text" id="customer-name" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: Juan Pérez">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Teléfono / WhatsApp</label>
                    <input type="tel" id="customer-phone" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ej: 3491555555">
                </div>
            </div>

            <div class="border-t pt-3 bg-white">
                <div class="flex justify-between text-lg font-bold mb-3">
                    <span class="text-gray-700">Total General:</span>
                    <span id="modal-total" class="text-emerald-600">$0.00</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl flex items-center justify-center space-x-2 shadow-lg transition-transform active:scale-95">
                    <i class="fab fa-whatsapp text-2xl"></i>
                    <span class="text-base">Enviar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="bg-white border-t py-6 px-4 text-sm text-gray-500">
        <div class="max-w-4xl mx-auto flex flex-col items-center text-center space-y-4">
            
            <!-- Texto principal arriba -->
            <div>
                <p>Potenciado por <span class="font-semibold text-purple-600">PhyMEx Store</span></p>
                <p class="text-xs text-gray-400 mt-1">de Aleph - Soluciones Informáticas</p>
            </div>

            <!-- Contenedor inferior para ambas imágenes -->
            <div class="flex items-center justify-center gap-6">
                <!-- LOGO_NOMBRE.png -->
                <div class="flex-shrink-0">
                    <img src="LOGO_NOMBRE.png" alt="Logo Nombre" class="h-10 sm:h-12 object-contain">
                </div>

                <!-- LOGO_ALEPH_1 (Ajuste la extensión a .jpg o .png según corresponda) -->
                <div class="flex-shrink-0">
                    <img src="LOGO_ALEPH_1.png" alt="Logo Aleph" class="h-10 sm:h-12 object-contain">
                </div>
            </div>

        </div>
    </footer>
    
    <!-- Lógica de la Tienda, Carrito y Sincronización con GitHub -->
    <script>
        let currentCatalog = [];
        let currentConfig = {};
        let cart = [];

        async function loadStore() {
            const urlParams = new URLSearchParams(window.location.search);
            const storeSlug = urlParams.get('store');

            if (!storeSlug) {
                showError("No se ha especificado ninguna tienda en el enlace (?store=nombre).");
                return;
            }

            try {
                const [configRes, productsRes] = await Promise.all([
                    fetch(`./artesanos/${storeSlug}/config.json`),
                    fetch(`./artesanos/${storeSlug}/products.json`)
                ]);

                if (!configRes.ok || !productsRes.ok) {
                    throw new Error("No se encontraron los registros para este taller.");
                }

                currentConfig = await configRes.json();
                const catalog = await productsRes.json();
                currentCatalog = catalog.products || [];

                renderStore(currentConfig, currentCatalog, storeSlug);
            } catch (err) {
                showError("Error al sincronizar los datos: " + err.message);
            }
        }

        function renderStore(config, catalog, storeSlug) {
            document.getElementById('loading').classList.add('hidden');
            
            document.title = `${config.name} - Catálogo Oficial`;
            document.getElementById('store-name').textContent = config.name;
            document.getElementById('store-owner').textContent = `de ${config.owner}`;
            
            const primaryColor = config.primary_color || '#6750A4';
            document.getElementById('store-header').style.backgroundColor = primaryColor;

            const logoImg = document.getElementById('store-logo');
            if (config.logo && config.logo.trim() !== '') {
                logoImg.src = config.logo.startsWith('http') ? config.logo : `./artesanos/${storeSlug}/${config.logo}`;
                logoImg.classList.remove('hidden');
            }

            const grid = document.getElementById('products-grid');
            grid.classList.remove('hidden');

            if (catalog.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">Este taller aún no cuenta con productos activos.</p>';
                return;
            }

            grid.innerHTML = catalog.map((p, index) => {
                let imageUrl = '';
                if (p.image && p.image.trim() !== '') {
                    imageUrl = p.image.startsWith('http') ? p.image : `./artesanos/${storeSlug}/${p.image}`;
                }

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                        <div>
                            ${imageUrl ? `<img src="${imageUrl}" alt="${p.name}" class="w-full h-48 object-cover">` : `<div class="w-full h-48 bg-gray-100 flex items-center justify-center text-gray-400"><i class="fas fa-store text-3xl"></i></div>`}
                            <div class="p-4">
                                <h3 class="font-bold text-lg text-gray-800 mb-1">${p.name}</h3>
                                <p class="text-gray-600 text-sm mb-3 line-clamp-2">${p.description || 'Sin descripción adicional'}</p>
                                <div class="text-xl font-bold text-gray-900 mb-2">$${p.price.toFixed(2)}</div>
                                <span class="inline-block text-xs px-2.5 py-1 rounded-full bg-green-50 text-green-700 font-medium">Stock disponible: ${p.stock}</span>
                            </div>
                        </div>
                        <div class="p-4 pt-0">
                            <button onclick="addToCart(${index})" class="w-full block text-center bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2 shadow-sm">
                                <i class="fas fa-cart-plus"></i>
                                <span>Agregar al Carrito</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(index) {
            const product = currentCatalog[index];
            const existingItem = cart.find(item => item.index === index);

            if (existingItem) {
                if (existingItem.quantity < product.stock) {
                    existingItem.quantity++;
                } else {
                    alert('Has alcanzado el límite de stock disponible para este producto.');
                    return;
                }
            } else {
                cart.push({ index, product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateQuantity(index, delta) {
            const item = cart.find(i => i.index === index);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.index !== index);
            } else if (item.quantity > item.product.stock) {
                item.quantity = item.product.stock;
                alert('Stock máximo alcanzado.');
            }
            updateCartUI();
            openCartModal();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

            if (totalItems > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
                closeCartModal();
            }

            cartCount.textContent = `${totalItems} ${totalItems === 1 ? 'producto' : 'productos'}`;
            cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function openCartModal() {
            if (cart.length === 0) return;
            const modalList = document.getElementById('cart-items-list');
            const modalTotal = document.getElementById('modal-total');
            
            let totalPrice = 0;
            modalList.innerHTML = cart.map(item => {
                const subtotal = item.product.price * item.quantity;
                totalPrice += subtotal;
                return `
                    <div class="py-2.5 flex justify-between items-center">
                        <div class="pr-2">
                            <h4 class="font-semibold text-gray-800 text-sm">${item.product.name}</h4>
                            <p class="text-xs text-gray-500">$${item.product.price.toFixed(2)} c/u</p>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <div class="flex items-center border rounded-lg bg-gray-50 shadow-sm">
                                <button onclick="updateQuantity(${item.index}, -1)" class="px-2.5 py-1 text-gray-600 hover:bg-gray-200 rounded-l-lg font-bold">-</button>
                                <span class="px-3 font-semibold text-sm">${item.quantity}</span>
                                <button onclick="updateQuantity(${item.index}, 1)" class="px-2.5 py-1 text-gray-600 hover:bg-gray-200 rounded-r-lg font-bold">+</button>
                            </div>
                            <span class="font-bold text-gray-800 w-16 text-right text-sm">$${subtotal.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            modalTotal.textContent = `$${totalPrice.toFixed(2)}`;
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        async function checkoutWhatsApp() {
            if (cart.length === 0) return;

            const customerName = document.getElementById('customer-name').value.trim();
            const customerPhone = document.getElementById('customer-phone').value.trim();

            if (!customerName) {
                alert('Por favor, ingresa tu Nombre y Apellido para continuar.');
                document.getElementById('customer-name').focus();
                return;
            }

            let totalPrice = 0;
            const itemsPayload = [];

            cart.forEach(item => {
                const subtotal = item.product.price * item.quantity;
                totalPrice += subtotal;
                itemsPayload.push({
                    product_id: item.product.id || (item.index + 1),
                    quantity: item.quantity,
                    unit_price: item.product.price
                });
            });

            // Obtener la hora local exacta (evita el desfase UTC de 3 horas)
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const createdAtFormatted = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            const urlParams = new URLSearchParams(window.location.search);
            const storeSlug = urlParams.get('store');

            // CONFIGURACIÓN DE GITHUB
            const GITHUB_USER = "alvarezsolucionesinformaticas-phymex";
            const GITHUB_REPO = "phymex-store";
            const partA = "ghp_i1OxjhJAM";
            const partB = "fASW4ht3xgygn";
            const partC = "c8fn9ygt2edvqe";
            const GITHUB_TOKEN = partA + partB + partC;
            const filePath = `artesanos/${storeSlug}/orders.json`;
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filePath}`;

            const btn = event.target.closest('button') || event.target;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Registrando pedido...`;
            btn.disabled = true;

            try {
                // 1. Obtener el orders.json actual (si existe)
                let existingOrders = [];
                let fileSha = null;

                const getRes = await fetch(apiUrl, {
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                    }
                });

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    fileSha = fileData.sha;
                    const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                    existingOrders = JSON.parse(decodedContent);
                }

                // 2. Calcular el id acumulativo correlativo
                const nextId = existingOrders.length > 0 ? Math.max(...existingOrders.map(o => o.id || 0)) + 1 : 1;

                const newOrder = {
                    id: nextId,
                    customer_name: customerName,
                    customer_phone: customerPhone || "No proporcionado",
                    status: "Pendiente",
                    total: totalPrice,
                    created_at: createdAtFormatted,
                    items: itemsPayload
                };

                // 3. Añadir el nuevo pedido al arreglo acumulativo
                existingOrders.push(newOrder);

                // 4. Preparar el cuerpo de la petición (JSON)
                const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(existingOrders, null, 2))));
                
                const bodyData = {
                    message: `Nuevo pedido #${nextId} de ${customerName} (${storeSlug})`,
                    content: updatedContentBase64
                };

                // ¡IMPORTANTE!: Solo incluimos el SHA si el archivo ya existe en GitHub
                if (fileSha) {
                    bodyData.sha = fileSha;
                }

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${GITHUB_TOKEN}`,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github.v3+json"
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!putRes.ok) {
                    const errDetails = await putRes.json();
                    throw new Error(`GitHub error (${putRes.status}): ${errDetails.message}`);
                }

            } catch (e) {
                console.error("Error de sincronización con GitHub:", e);
                alert("No se pudo guardar el pedido en el repositorio: " + e.message);
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                return; // Detiene la ejecución si falló para que lo revise
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }

            // 5. Armar mensaje de WhatsApp para el artesano
            let message = `¡Hola *${currentConfig.owner}*! Mi nombre es *${customerName}* (${customerPhone || 'Sin teléfono'}). Me interesa realizar el siguiente pedido:\n\n`;
            
            cart.forEach(item => {
                const subtotal = item.product.price * item.quantity;
                const cleanName = (item.product.name || '').replace(/\*/g, '');
                message += `• ${item.quantity}x *${cleanName}* - $${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total general: $${totalPrice.toFixed(2)}*\n\n¿Podría confirmarme disponibilidad? ¡Gracias!`;

            const whatsappUrl = `https://wa.me/${currentConfig.whatsapp}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');

            // Limpiar carrito y cerrar modal
            cart = [];
            updateCartUI();
            closeCartModal();
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            const errBox = document.getElementById('error-container');
            document.getElementById('error-message').textContent = msg;
            errBox.classList.remove('hidden');
        }

        window.onload = loadStore;
    </script>
</body>
</html>
